name: Verification

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - run: bun run verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
